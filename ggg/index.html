<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Segoe UI', 'Arial', sans-serif;
  background: #000814;
  color: #eaf2ff;
}

/* GALAXIA MÁS PROFUNDA */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(120,160,255,0.35), transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(90,120,255,0.25), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(160,120,255,0.2), transparent 60%),
    radial-gradient(circle at 60% 40%, rgba(80,140,255,0.18), transparent 70%);
  animation: nebula 20s ease-in-out infinite alternate;
  z-index: 0;
}

@keyframes nebula {
  from { transform: scale(1) translate(0,0); }
  to { transform: scale(1.3) translate(30px,-20px); }
}

/* ESTRELLAS MÁS REALISTAS */
.stars, .stars2, .stars3 {
  position: fixed;
  width: 200%;
  height: 200%;
  pointer-events: none;
}

.stars {
  background: radial-gradient(white 1px, transparent 1px);
  background-size: 160px 160px;
  animation: move1 100s linear infinite;
}

.stars2 {
  background: radial-gradient(#bcd4ff 1px, transparent 1px);
  background-size: 240px 240px;
  animation: move2 160s linear infinite;
}

.stars3 {
  background: radial-gradient(#7aa2ff 1px, transparent 1px);
  background-size: 300px 300px;
  animation: move3 220s linear infinite;
}

@keyframes move1 { from {transform: translate(0,0);} to {transform: translate(-500px,-800px);} }
@keyframes move2 { from {transform: translate(0,0);} to {transform: translate(-300px,-600px);} }
@keyframes move3 { from {transform: translate(0,0);} to {transform: translate(-200px,-400px);} }

/* LUNA MÁS HERMOSA */
.moon {
  position: absolute;
  top: 40px;
  right: 50px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffffff, #dfe6ff 30%, #9bb7ff 60%, #4d6fff 100%);
  box-shadow:
    0 0 80px #9bb7ff,
    0 0 120px rgba(120,160,255,0.6);
  animation: floatMoon 7s ease-in-out infinite;
  z-index: 2;
}

@keyframes floatMoon {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* CARTA */
.container {
  position: relative;
  margin: 80px auto;
  width: 90%;
  max-width: 380px;
  max-height: 70vh;
  overflow-y: auto;
  padding: 30px;
  border-radius: 24px;
  background: rgba(0, 15, 60, 0.6);
  backdrop-filter: blur(18px);
  box-shadow: 0 0 50px rgba(120,160,255,0.5);
  text-align: center;
  z-index: 3;
}

/* SCROLL BONITO */
.container::-webkit-scrollbar {
  width: 6px;
}
.container::-webkit-scrollbar-thumb {
  background: #6fa8ff;
  border-radius: 10px;
}

h1 {
  font-size: 24px;
  margin-bottom: 15px;
  letter-spacing: 1px;
  text-shadow: 0 0 15px #9bb7ff;
}

.text {
  font-size: 15px;
  line-height: 1.8;
  text-shadow: 0 0 12px #6fa8ff;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #4da3ff, #9bb7ff);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 20px #6fa8ff;
}

button.playing {
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* CORAZONES */
.heart {
  position: fixed;
  bottom: -20px;
  width: 14px;
  height: 14px;
  transform: rotate(45deg);
  animation: float 7s linear infinite;
  background: #7db7ff;
  box-shadow: 0 0 12px #7db7ff;
}

.heart::before, .heart::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  background: inherit;
  border-radius: 50%;
}

.heart::before { top: -7px; }
.heart::after { left: -7px; }

@keyframes float {
  to {
    transform: translateY(-120vh) rotate(45deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="moon"></div>

<div class="container">
  <h1>My sunshine</h1>
  <div class="text" id="text"></div>
  <button id="btn" onclick="toggleMusic()">Reproducir</button>
</div>

<audio id="music" src="tu-cancion.mp3"></audio>

<script>
const message = `Eres el chico más lindo que existe y jamás me cansaré de repetirlo una y mil veces más, no se como explicar todo el amor que siento por ti, más de medio año de relación y dios, no miento cuando digo que comencé a vivir cuando te conocí a tí, mi prioridad eres tú y tu felicidad, pido perdón si alguna vez te he hecho dudar del amor que siento por ti, te amo y te amaré más que a nada por el resto de mi vida, y si es verdad que existen más vidas a demás de esta estoy seguro que me volvería a enamorar de ti en cada una de ellas, tú lo eres todo para mi, realmente me gustaría estar contigo para toda la vida, ya que tú eres lo único que le da sentido, mi existencia se basa por pensar en ti, así como estaría dispuesto a morir por ti, ahora vivo solamente por tí, tuve la suerte de conocerte y haré hasta lo imposible por no perderte, realmente no se que es lo que te gustó de mi pero cualquier cosa que haya sido estoy completamente agradecido por que alguien tan genial como tú se haya fijado en alguien como yo.\n\nUn resumen de esto; Te amo ♥`;

let i = 0;
function typeWriter() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, 28);
  }
}
window.onload = typeWriter;

function toggleMusic() {
  const music = document.getElementById("music");
  const btn = document.getElementById("btn");

  if (music.paused) {
    music.volume = 0;
    music.play();
    let v = 0;
    let fade = setInterval(() => {
      if (v < 1) {
        v += 0.05;
        music.volume = v;
      } else clearInterval(fade);
    }, 100);
    btn.classList.add("playing");
    btn.innerText = "Pausar";
  } else {
    music.pause();
    btn.classList.remove("playing");
    btn.innerText = "Reproducir";
  }
}

setInterval(() => {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 8000);
}, 200);
</script>

</body>
</html>
